<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حل السؤال 24</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
            background: #f0f2f5;
            color: #1a1a2e;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        .header {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: #fff;
            padding: 24px 30px;
            border-radius: 12px 12px 0 0;
            text-align: center;
        }
        .header h1 {
            font-size: 1.6rem;
            margin-bottom: 6px;
        }
        .header p {
            font-size: 0.95rem;
            opacity: 0.85;
        }
        .notice {
            background: #fff3cd;
            border-right: 5px solid #ffc107;
            padding: 14px 20px;
            font-size: 0.95rem;
            line-height: 1.8;
            color: #664d03;
        }
        .notice strong {
            display: block;
            margin-bottom: 4px;
            font-size: 1rem;
        }
        .notice ul {
            margin: 6px 20px 0;
            padding: 0;
        }
        .notice li {
            margin-bottom: 4px;
        }
        .image-wrapper {
            background: #fff;
            padding: 20px;
            border-radius: 0 0 12px 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            text-align: center;
        }
        .image-wrapper img {
            max-width: 100%;
            height: auto;
            border-radius: 6px;
        }
        .footer {
            text-align: center;
            margin-top: 16px;
            font-size: 0.85rem;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>حل السؤال 24</h1>
            <p>دوسية الرياضيات - 2010</p>
        </div>
        <div class="notice">
            <strong>ملاحظات مهمة:</strong>
            <ul>
                <li>رمز QR رقم 19 يحتوي على حل الأفرع الثلاثة: 19 ، 20 ، 21</li>
                <li>السؤال 22 مكرر (مسألة اليوم)</li>
            </ul>
        </div>
        <div class="image-wrapper">
            <img src="../images/qr-24.png" alt="حل السؤال 24">
        </div>
        <div class="footer">جميع الحقوق محفوظة</div>
    </div>
</body>
</html>
